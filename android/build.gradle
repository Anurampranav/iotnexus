// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

allprojects {
  repositories {
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"

subprojects { subproject ->
    def applyTaskConfig = {
        subproject.tasks.configureEach { task ->
            if (task.name.contains("NativeLibs") || task.name.contains("CMake") || task.name.contains("prefab") || task.name.contains("externalNativeBuild") || task.name.contains("bundleReleaseAar")) {
                task.doNotTrackState("Windows symlink workaround")
            }
        }
    }
    if (subproject.state.executed) {
        applyTaskConfig()
    } else {
        subproject.afterEvaluate {
            applyTaskConfig()
        }
    }
}
